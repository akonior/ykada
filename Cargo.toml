[package]
name = "ykada"
version = "0.5.0"
edition = "2021"
description = "Turn a YubiKey into a Cardano hardware wallet"
license = "Apache-2.0"
repository = "https://github.com/akonior/ykada"

[dependencies]
ed25519-dalek = "3"
hex = "0.4.3"
thiserror = "2.0"
# 0.9 adds Ed25519 import and signing (YubiKey firmware 5.7+).
yubikey = "0.9.0-rc.0"

# Key derivation
bip39 = { version = "3", features = ["zeroize"] }
pbkdf2 = "0.13"
sha2 = "0.11"
ed25519-bip32 = "0.5"
getrandom = "0.4"

# Network
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cardano addresses and transactions
pallas-txbuilder = "1.5"
pallas-addresses = "1.5"
pallas-codec = "1.5"
pallas-crypto = "1.5"
pallas-primitives = "1.5"

# CLI
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
pinentry = "0.8"
secrecy = "0.10"

[dev-dependencies]
bech32 = "0.11"
proptest = { version = "1", default-features = false, features = ["std"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

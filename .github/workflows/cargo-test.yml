name: Cargo Test

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install system dependencies for pcsc
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build binaries
        run: cargo build --bins --locked

      - name: Run unit, property and CLI tests
        run: cargo test --all-targets --locked --verbose

      - name: Run script tests (integration test reset guard)
        run: python3 -m unittest discover -s scripts -v

      - name: Rust format check
        run: cargo fmt --check

      - name: Lint with clippy
        run: cargo clippy --all-targets --all-features --locked -- --deny warnings
